<article class="booking_calendar">
 	<md-tabs id="tabsbook" md-selected="$parent.selectedTabIndex" md-dynamic-height md-border-bottom md-autoselect>
 		
	    	<md-tab label="{{tabsBook[0].title}}" ng-disabled="tabsBook[0].disabled" ng-click="$parent.selectedTabIndex = 0;">
		  		<loading></loading>
		 	  				    
				<show-calendar-table id="table-month" ng-show="!isViewLoading && showCalendar">
				</show-calendar-table>
				
				<show-search ng-show="!isViewLoading">
				</show-search>

				<md-divider class="clear">
				
				<div ng-show="!isViewLoading && searchInputScope.dateOrigin" layout="row" class="md-actions" layout-align="start center">
	    			<span flex></span>
	    			<md-button ng-click="saveSearch()" class="md-primary md-hue-2">
	    				<span lnt-id="fly.action.searchOffers">Ver resultados</span>
	    				<md-icon md-font-library="material-icons" class="md-24 md-accents">search</md-icon>
	    			</md-button>
	    			<span flex></span>
	   			</div>	
			</md-tab>
    	
    		<md-tab label="{{tabsBook[1].title}}" ng-disabled="tabsBook[1].disabled" ng-click="$parent.selectedTabIndex = 1;">
    			<loading></loading>
     			<show-list-offers ng-show="!isViewLoading">
     			</show-list-offers>
      		</md-tab>

				<show-save-search ng-show="!isViewLoading && !adminOption">
				</show-save-search>
      		</md-tab>

			<md-tab label="{{tabsBook[3].title}}" ng-disabled="tabsBook[3].disabled" ng-click="$parent.selectedTabIndex = 3;">

				<show-save-search-end ng-show="!isViewLoading">
				</show-save-search-end>
      		</md-tab>-->
